# Runtime of the Claude plugin: pins italy-eli-mcp and every transitive dependency
# (with hashes) in uv.lock, so the plugin runs exactly what was reviewed.
# Started by plugin.json as: uvx italy-eli-mcp==0.7.3 (Claude Code's locked launch reads this uv.lock)
[project]
name = "it-eli-mcp-plugin-runtime"
version = "0.7.3"
requires-python = ">=3.11,<3.14"
dependencies = ["italy-eli-mcp==0.7.3"]

[tool.uv]
package = false
